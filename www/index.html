<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<meta name="application-name" content="Галка: Планы и заметки">
<meta name="description" content="«Галка» — простой и удобный планировщик для задач, заметок и важных дел. Пользователь может записывать планы на сегодня или любую другую дату, создавать заметки, устанавливать напоминания и отмечать выполненные задачи галочкой. Главная идея приложения — собрать всё важное в одном месте без перегруженного интерфейса и лишней сложности.">
<meta name="author" content="Феофилакт Птахен">
<meta name="category" content="Планировщик / Производительность">
<meta name="keywords" content="календарь, задачи, заметки, планы, напоминания">
<meta name="tagline" content="Не забудь про галочку!">
<meta name="app-principle" content="записал → не забыл → сделал → поставил галочку">
<title>Галка: Планы и заметки</title>
<link rel="stylesheet" href="styles.css?v=20260816-dialog">
</head>
<body>

<div id="app">
  <main id="main">

    <!-- ============ КАЛЕНДАРЬ ============ -->
    <section class="view active" id="v-cal">
      <header class="topbar">
        <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="month-btn" id="monthBtn">
          <span id="monthLabel">—</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="icon-btn push-right" id="collapseBtn" aria-label="Свернуть календарь"></button>
        <button class="icon-btn" id="todayBtn" aria-label="Сегодня">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
        </button>
      </header>

      <div class="weekdays" id="weekdays"></div>

      <div class="month" id="month">
        <div class="weeks" id="weeks"></div>
      </div>

      <button class="grabber" id="grabber" aria-label="Свернуть календарь"><span></span></button>

      <div class="agenda" id="agenda"></div>
    </section>

    <!-- ============ ЗАДАЧИ ПО РАЗДЕЛАМ ============ -->
    <section class="view" id="v-list">
      <header class="topbar">
        <h1 class="page-title">Задачи</h1>
      </header>
      <div class="list-switch" role="tablist" aria-label="Порядок задач">
        <button class="on" data-list-mode="sections" role="tab" aria-selected="true">По разделам</button>
        <button data-list-mode="date" role="tab" aria-selected="false">По порядку</button>
      </div>
      <div class="chips-row section-filter" id="sectionFilter" role="group" aria-label="Выбор разделов"></div>
      <div class="listbody" id="listBody"></div>
    </section>

    <!-- ============ НАСТРОЙКИ ============ -->
    <section class="view" id="v-set">
      <header class="topbar">
        <h1 class="page-title">Настройки</h1>
      </header>
      <div class="setbody" id="setBody"></div>
    </section>

  </main>

  <button class="fab" id="fab" aria-label="Новая задача">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab active" data-view="v-cal">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Календарь</span>
    </button>
    <button class="tab" data-view="v-list">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>Задачи</span>
    </button>
    <button class="tab" data-view="v-set">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.32 1.77l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.6 1.6 0 00-1.77-.32 1.6 1.6 0 00-.97 1.47V21a2 2 0 11-4 0v-.11a1.6 1.6 0 00-1.05-1.46 1.6 1.6 0 00-1.77.32l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.6 1.6 0 00.32-1.77 1.6 1.6 0 00-1.47-.97H3a2 2 0 110-4h.11a1.6 1.6 0 001.46-1.05 1.6 1.6 0 00-.32-1.77l-.06-.06a2 2 0 112.83-2.83l.06.06a1.6 1.6 0 001.77.32H9a1.6 1.6 0 00.97-1.47V3a2 2 0 114 0v.11a1.6 1.6 0 00.97 1.47 1.6 1.6 0 001.77-.32l.06-.06a2 2 0 112.83 2.83l-.06.06a1.6 1.6 0 00-.32 1.77V9a1.6 1.6 0 001.47.97H21a2 2 0 110 4h-.11a1.6 1.6 0 00-1.47.97z"/></svg>
      <span>Настройки</span>
    </button>
  </nav>
</div>

<!-- ============ ШТОРКА: ЗАДАЧА ============ -->
<div class="backdrop" id="backdrop"></div>

<!-- ============ ШТОРКА: ТЕКСТ ЗАМЕТКИ ============ -->
<!-- Открывается карандашом. Здесь только заголовок и текст, как в заметках
     на телефоне. Даты, время и раздел живут за шестерёнкой. -->
<div class="sheet note-sheet" id="noteSheet">
  <div class="sheet-head note-head">
    <button class="icon-btn" id="noteBack" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
    </button>
    <button class="icon-btn push-right" id="noteSettings" aria-label="Настройки задачи">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5v.2a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2.8a2 2 0 110-4h.1A1.7 1.7 0 004.4 9a1.7 1.7 0 00-.3-1.9L4 7a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V2.8a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1A2 2 0 1120 7l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1h.2a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
    <!-- Карандаш и галочка меняются местами: пока заметку смотрят, сохранять
         нечего, а пока правят — нечего включать. -->
    <button class="icon-btn" id="noteEdit" aria-label="Редактировать">
      <svg viewBox="0 0 24 24"><path d="M4 20h4l11-11a2.8 2.8 0 00-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
    </button>
    <button class="icon-btn note-apply" id="noteSave" aria-label="Готово" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
    </button>
  </div>
  <div class="note-body">
    <input class="note-title" id="nTitle" placeholder="Заголовок" autocomplete="off">
    <div class="note-meta" id="nMeta"></div>
    <div class="note-text" id="nText" contenteditable="true"
         role="textbox" aria-multiline="true" aria-label="Текст заметки"
         data-placeholder="Начните ввод"></div>
  </div>
  <!-- Панель прокручивается пальцем: кнопок больше, чем помещается
       на узком экране, а прятать их в подменю значит закапывать. -->
  <div class="note-tools" id="noteTools">
    <button type="button" class="note-tool wide" id="nItemBtn" aria-label="Пункт списка">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <span>Пункт</span>
    </button>
    <span class="note-tools-sep"></span>

    <button type="button" class="note-tool" data-fmt="heading" aria-label="Заголовок">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M16 5v14M6 12h10"/><path d="M18.5 8.5l2-1.5v12"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="bold" aria-label="Жирный"><b>Ж</b></button>
    <button type="button" class="note-tool" data-fmt="italic" aria-label="Наклонный"><i>К</i></button>
    <button type="button" class="note-tool" data-fmt="underline" aria-label="Подчёркнутый"><u>Ч</u></button>
    <button type="button" class="note-tool" data-fmt="strikeThrough" aria-label="Зачёркнутый"><s>З</s></button>
    <button type="button" class="note-tool" data-fmt="highlight" aria-label="Выделитель">
      <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M9 16l-3 1 1-3 8-8 2 2z"/><path d="M14 5l2-2 3 3-2 2"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="spoiler" aria-label="Скрытый текст">
      <svg viewBox="0 0 24 24"><path d="M3 12s3.6-6 9-6 9 6 9 6-3.6 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="link" aria-label="Ссылка">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/></svg>
    </button>
    <span class="note-tools-sep"></span>

    <button type="button" class="note-tool" data-fmt="list" aria-label="Список">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="align" aria-label="Выравнивание">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h11M4 18h16"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="indent" aria-label="Сдвинуть вправо">
      <svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3 9l3 3-3 3"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="outdent" aria-label="Сдвинуть влево">
      <svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M6 9l-3 3 3 3"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="quote" aria-label="Цитата">
      <svg viewBox="0 0 24 24"><path d="M4 5v14"/><path d="M9 8c0 4-2 5-2 5h3v4H7"/><path d="M17 8c0 4-2 5-2 5h3v4h-3"/></svg>
    </button>
    <button type="button" class="note-tool" data-fmt="divider" aria-label="Разделитель">
      <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M6 6h12M6 18h12" opacity=".45"/></svg>
    </button>
  </div>
</div>

<div class="sheet" id="taskSheet">
  <div class="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="taskCancel">Отмена</button>
    <span class="sheet-title" id="taskSheetTitle">Настройки</span>
    <button class="sheet-save" id="taskSave">Готово</button>
  </div>
  <div class="sheet-body">
    <div class="field-label">Раздел</div>
    <div class="chips-row inline" id="projChips"></div>

    <div class="field-label">Дни</div>
    <div class="day-mode-switch" id="dayModeSwitch" role="tablist" aria-label="Выбор дней задачи">
      <button class="on" data-day-mode="once" role="tab" aria-selected="true">Единоразово</button>
      <button data-day-mode="daily" role="tab" aria-selected="false">Ежедневно</button>
      <button data-day-mode="weekly" role="tab" aria-selected="false">Еженедельно</button>
      <button data-day-mode="custom" role="tab" aria-selected="false">Выбрать свои дни</button>
    </div>

    <div class="day-mode-panel" id="daySimple">
      <div class="field-row day-date-row">
        <div class="field">
          <span class="field-label" id="dateStartLabel">Дата</span>
          <button type="button" class="value-btn" data-date-field="start">
            <span id="dateStartText">—</span>
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
        </div>
        <div class="field" id="dateEndField">
          <span class="field-label">По</span>
          <button type="button" class="value-btn" data-date-field="end">
            <span id="dateEndText">—</span>
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </button>
        </div>
      </div>
      <div class="day-mode-summary" id="dayModeSummary"></div>
    </div>

    <div class="day-custom hidden" id="dayCustom">
      <div class="picker">
        <div class="picker-head">
          <button id="pickPrev" aria-label="Предыдущий месяц">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <b id="pickLabel">—</b>
          <button id="pickNext" aria-label="Следующий месяц">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="pick-wd" id="pickWd"></div>
        <div class="pick-grid" id="pickGrid"></div>
        <div class="pick-count">
          <span id="pickCount">Ничего не выбрано</span>
          <button class="pick-clear" id="pickClear">Очистить</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <span class="field-label">Время</span>
        <button type="button" class="value-btn" id="fTimeBtn">
          <span id="fTimeText">Не задано</span>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
        </button>
      </div>
      <div class="field">
        <span class="field-label">&nbsp;</span>
        <label class="switch-inline">
          <input type="checkbox" id="fNoTime" class="sw">
          <i class="sw-track"></i>
          <span>Без времени</span>
        </label>
      </div>
    </div>

    <div class="field-label">Напомнить</div>
    <div class="chips-row inline" id="remChips"></div>

    <button class="danger-btn" id="taskDelete">Удалить задачу</button>
  </div>
</div>

<!-- ============ ШТОРКА: РАЗДЕЛ ============ -->
<div class="sheet" id="projSheet">
  <div class="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="projCancel">Отмена</button>
    <span class="sheet-title" id="projSheetTitle">Новый раздел</span>
    <button class="sheet-save" id="projSave">Готово</button>
  </div>
  <div class="sheet-body">
    <input class="big-input" id="pName" placeholder="Название раздела" autocomplete="off">
    <textarea class="note-input" id="pDescription" placeholder="Описание раздела (необязательно)" rows="2"></textarea>
    <div class="field-label">Цвет</div>
    <div class="palette" id="palette"></div>
    <div class="project-details hidden" id="projectDetails">
      <div class="project-stats" id="projectStats"></div>
      <div class="field-label">Задачи раздела</div>
      <div class="project-tasks" id="projectTasks"></div>
    </div>
    <button class="danger-btn" id="projDelete">Удалить раздел</button>
  </div>
</div>

<!-- ============ ШТОРКА: ПЕРЕХОД К ДАТЕ ============ -->
<div class="sheet" id="jumpSheet">
  <div class="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="jumpCancel">Отмена</button>
    <span class="sheet-title">Перейти к дате</span>
    <button class="sheet-save" id="jumpToday">Сегодня</button>
  </div>
  <div class="sheet-body">
    <div class="field-label">Год</div>
    <div class="year-strip" id="yearStrip"></div>
    <div class="field-label">Месяц</div>
    <div class="month-grid" id="monthGrid"></div>
  </div>
</div>

<!-- ============ ШТОРКА: СЛУЖЕБНАЯ ИНФОРМАЦИЯ ============ -->
<div class="sheet info-sheet" id="infoSheet">
  <div class="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="infoClose">Закрыть</button>
    <span class="sheet-title" id="infoSheetTitle">О приложении</span>
    <span class="sheet-head-spacer" aria-hidden="true"></span>
  </div>
  <div class="sheet-body info-body" id="infoBody"></div>
</div>

<!-- ============ ШТОРКА: ВЫБОР ВРЕМЕНИ, ДАТЫ И ВАРИАНТА ============ -->
<div class="sheet picker-sheet" id="pickerSheet">
  <div class="sheet-grab"><span></span></div>
  <div class="sheet-head">
    <button class="sheet-cancel" id="pickerCancel">Отмена</button>
    <span class="sheet-title" id="pickerTitle">—</span>
    <button class="sheet-save" id="pickerDone">Готово</button>
  </div>
  <div class="sheet-body" id="pickerBody"></div>
</div>

<!-- ============ ОКНО ПОДТВЕРЖДЕНИЯ ============ -->
<div class="dialog-wrap" id="dialogWrap">
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
    <b class="dialog-title" id="dialogTitle">—</b>
    <p class="dialog-text" id="dialogText"></p>
    <!-- Поля для окон, где спрашивают не только «да» или «нет» -->
    <div class="dialog-extra" id="dialogExtra" hidden></div>
    <div class="dialog-actions">
      <button class="dialog-btn" id="dialogCancel">Отмена</button>
      <button class="dialog-btn primary" id="dialogOk">Продолжить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="store.js?v=20260816-dialog"></script>
<script src="notify.js?v=20260816-dialog"></script>
<script src="backup.js?v=20260816-dialog"></script>
<script src="picker.js?v=20260816-dialog"></script>
<script src="app.js?v=20260816-dialog"></script>
</body>
</html>
